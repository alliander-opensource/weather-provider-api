name: Documentation
on:
  push:
    branches:
      - main-*
permissions:
    contents: read
concurrency:
  group: documentation-gh-pages-update
  cancel-in-progress: true
jobs:
  # Build the Zensical documentation and open a signed PR to the gh-pages branch
  deploy:
    runs-on:
      group: managed
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Check out the source to build the documentation from
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build documentation site
        run: uv run --only-group docs zensical build --clean
      # Check out the published branch into a subdirectory
      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
      # Replace the branch contents with the freshly built site
      - name: Stage built site onto gh-pages
        run: |
          find gh-pages -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a site/. gh-pages/
          touch gh-pages/.nojekyll
      # Open a signed PR with the updated site (branch protection requires a signed PR)
      - name: Open PR to update gh-pages
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: gh-pages
          base: gh-pages
          branch: chore/gh-pages-update
          commit-message: "docs: update GitHub Pages site"
          sign-commits: true
          title: "docs: update GitHub Pages site"
          body: |
            Automated documentation build from the `${{ github.workflow }}`
            workflow (source commit ${{ github.sha }}).
          delete-branch: true
      # Auto-merge the PR so the site publishes without manual intervention
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"
