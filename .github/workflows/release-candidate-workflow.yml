name: Release Candidate evaluation
on:
  push:
    branches:
      - release-*
permissions:
  contents: read
jobs:
  # ---------------------------------------------------------------- #
  # |  Coverage and SonarCloud.io upload                           | #
  # ---------------------------------------------------------------- #
  tests-and-sonarcloud:
    concurrency:
      group: release-candidate-evaluation-${{ github.ref_name }}
      cancel-in-progress: true
    strategy:
      matrix:
        version: ["3.13"]
    name: Testing and updating SonarCloud
    runs-on: mgd-ubuntu24-x64-4c16g
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Checkout
      - name: Branch checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Install Python
      - name: Setup Python installation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.version }}
      # Install uv (with built-in dependency caching)
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Regenerate the lockfile so each release resolves against the latest allowed versions
      - name: Regenerate uv.lock
        run: uv lock --upgrade
      # Install required dependencies
      - name: Install dependencies
        run: uv sync
      # Install ecCodes dependencies
      - name: Install ecCodes
        run: sudo apt-get update && sudo apt-get install -y libeccodes0 libeccodes-dev
      # Run tests with coverage. Coverage flags are passed explicitly here (not via addopts)
      # so local/PyCharm runs are not forced to use pytest-cov. This writes coverage.xml
      # (consumed by SonarCloud below) and prints the terminal report.
      - name: Run tests and coverage
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          CDSAPI_VERIFY: 1
          KNMI_DATA_PLATFORM_KEY: ${{ secrets.KNMI_DATA_PLATFORM_KEY }}
        run: uv run pytest --cov --cov-branch --cov-report=xml --cov-report=term-missing
      # Upload coverage data to SonarCloud.io
      - if: matrix.version == '3.13'
        name: Update SonarCloud.io
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Open a PR with the regenerated lockfile (branch protection requires PRs)
      - if: matrix.version == '3.13'
        name: Open PR for regenerated uv.lock
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: uv.lock
          base: ${{ github.ref_name }}
          branch: chore/uv-lock-update-${{ github.ref_name }}
          commit-message: "chore: regenerate uv.lock"
          sign-commits: true
          title: "chore: regenerate uv.lock for ${{ github.ref_name }}"
          body: |
            Automated lockfile regeneration (`uv lock --upgrade`) from the
            `${{ github.workflow }}` workflow on `${{ github.ref_name }}`.
          delete-branch: true
  # ---------------------------------------------------------------- #
  # |  Build image and upload it to AWS and DockerHub              | #
  # ---------------------------------------------------------------- #
  create-and-upload-image:
    name: Create and upload image
    needs: tests-and-sonarcloud
    runs-on: mgd-ubuntu24-x64-4c16g
    permissions:
      id-token: write
      contents: read
    environment:
      name: ci
    steps:
      # Checkout
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::325973380531:role/dnb-inno-repository-access-role
          aws-region: eu-central-1
      # Install uv (needed for version)
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
      - name: Determine current version
        run: |
          version="$(uv version --short)rc${{ github.run_number }}"
          echo "Package version: $version"
          echo "package_version=$version" >> $GITHUB_ENV
      # Create the image and upload it to Amazon ECR
      - name: Build, tag, and push image to Amazon ECR
        run: |
          docker build --target gunicorn-image -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_RC }}:${{ env.package_version }} .
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_RC }}:${{ env.package_version }}
          docker build -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_RC }} .
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_RC }}
