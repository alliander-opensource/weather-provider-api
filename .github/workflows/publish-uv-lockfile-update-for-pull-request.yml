name: Publish uv.lock update for pull request

on:
  workflow_run:
    workflows:
      - Update uv.lock for pull request
    types: [completed]

permissions:
  contents: read

jobs:
  publish-lockfile:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null &&
      github.event.workflow_run.pull_requests[0].state == 'open'
    runs-on: mgd-ubuntu24-x64-4c16g
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download generated lockfile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uv-lockfile
          path: uv-lock-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage generated lockfile
        run: |
          test -f uv-lock-artifact/uv.lock
          test ! -L uv-lock-artifact/uv.lock
          install -m 0644 uv-lock-artifact/uv.lock uv.lock
          git add -f uv.lock

      - name: Open lockfile update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
          branch: chore/uv-lock-update-pr-${{ github.event.workflow_run.pull_requests[0].number }}
          commit-message: "chore: regenerate uv.lock"
          sign-commits: true
          title: "chore: regenerate uv.lock for PR #${{ github.event.workflow_run.pull_requests[0].number }}"
          body: |
            Automated lockfile regeneration (`uv lock`) for #${{ github.event.workflow_run.pull_requests[0].number }}.
          add-paths: uv.lock
          delete-branch: true
