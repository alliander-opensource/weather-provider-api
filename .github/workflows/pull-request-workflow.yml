name: Pull Request Evaluation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pull-request-evaluation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # ---------------------------------------------------------------- #
  # |  Coverage and SonarCloud.io upload                           | #
  # ---------------------------------------------------------------- #
  tests-and-sonarcloud:
    strategy:
      matrix:
        version: ["3.13"]
    name: Testing and updating SonarCloud
    runs-on:
      group: managed
    permissions:
      contents: read
    steps:
      # Checkout
      - name: Branch checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      # Install Python
      - name: Setup Python installation
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.version }}
      # Install uv (with built-in dependency caching)
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Install required dependencies
      - name: Install dependencies
        run: uv sync
      # Install ecCodes dependencies
      - name: Install ecCodes
        run: sudo apt-get update && sudo apt-get install -y libeccodes0 libeccodes-dev

      # Run tests with coverage (pytest-cov is configured via addopts in pyproject.toml,
      # which also writes coverage.xml and prints the terminal report)
      - name: Run tests and coverage
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          CDSAPI_VERIFY: 1
          KNMI_DATA_PLATFORM_KEY: ${{ secrets.KNMI_DATA_PLATFORM_KEY }}
        run: uv run pytest
      # Upload coverage data to SonarCloud.io
      - if: matrix.version == '3.13'
        name: Update SonarCloud.io
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
