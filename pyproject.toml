[project]
name = "weather_provider_api"
version = "2.92"
description = "Weather Provider Libraries and API"
authors = [
    { name = "Verbindingsteam" },
    { name = "Raoul Linnenbank", email = "58594297+rflinnenbank@users.noreply.github.com" },
]
requires-python = ">=3.12,<3.14"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "accept-types>=0.4.1,<0.5.0",
    "cdsapi>=0.7.7,<0.8.0",
    "cfgrib>=0.9.15.1,<0.10.0.0",
    "coverage==7.16.0",
    "dask>=2026.7.1,<2027.0.0",
    "eccodes>=2.47.0,<3.0.0",
    "fastapi>=0.141.0,<0.142.0",
    "geopy>=2.5.0,<3.0.0",
    "gunicorn>=26.0.0,<27.0.0",
    "loguru>=0.7.3,<0.8.0",
    "lxml>=6.1.1,<7.0.0",
    "netcdf4>=1.7.4,<2.0.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3,<4.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "requests>=2.34.2,<3.0.0",
    "slowapi>=0.1.10,<0.2.0",
    "starlette>=1.4.0,<2.0.0",
    "starlette-prometheus>=0.10.0,<0.11.0",
    "types-gunicorn==26.2.0.20260827",
    "urllib3>=2.7.0,<3.0.0",
    "uvicorn>=0.52.0,<0.53.0",
    "xarray>=2026.7.0,<2027.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.15.0,<8.0.0",
    "deptry>=0.25.1",
    "fawltydeps>=0.20.0,<0.21.0",
    "hypothesis>=6.167.1",
    "mypy>=2.2.0,<3.0.0",
    "pandas-stubs>=3.0.3.260530",
    "pre-commit>=4.6.0,<5.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-xdist>=3.8.0",
    "reuse>=6.2.0,<7.0.0",
    "ruff>=0.16.0,<0.17.0",
    "types-gunicorn>=26.0.0.20260728",
    "vulture>=2.16",
    "zensical>=0.0.50",
]
docs = [
    "mkdocstrings-python>=2.0.5",
    "zensical>=0.0.50,<0.0.51",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"


[tool.uv]
exclude-newer = "7 days"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflake
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # pydocstyle
    "D",
    # flake8-bandit
    "S",
    # flake8-logging
    "LOG"
]
ignore = ["D100", "D104"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pylint]
max-args = 10

[tool.pytest.ini_options]
# Coverage flags are intentionally NOT set here so that local runs (and PyCharm's own
# "Run with Coverage") work without conflicting with pytest-cov. Enable coverage explicitly
# in CI, e.g.:
#   pytest --cov --cov-branch --cov-report=xml --cov-report=term-missing
addopts = [
  "-rfEX",
  "-p", "pytester",
  "--strict-markers",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
# Only measure the application package; never report on the test suite itself.
source = ["weather_provider_api"]
omit = ["tests/*", "weather_provider_api/scripts/*"]

[tool.coverage.paths]
source = ["weather_provider_api"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't reach defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod", # Disabled for now
]
ignore_errors = true

[tool.coverage.html]
directory = "coverage_html_report"

[tool.mypy]
plugins = ['pydantic.mypy']
exclude = '^(\.venv/|info/|dist/|coverage_html_report/|tests/)'

[[tool.mypy.overrides]]
module = ["mkdocs_gen_files"]
ignore_missing_imports = true
