[project]
name = "weather_provider_api"
version = "2.91"
description = "Weather Provider Libraries and API"
authors = [
    { name = "Verbindingsteam" },
    { name = "Raoul Linnenbank", email = "58594297+rflinnenbank@users.noreply.github.com" }
]
license = "MPL-2.0"
requires-python = ">=3.12,<3.14"
readme = "README.md"
urls = { repository = "https://github.com/alliander-opensource/wpla/" }

dependencies = [
"xarray>=2026.4.0,<2027.0.0",
"fastapi>=0.136.1,<0.137.0",
"slowapi>=0.1.9,<0.2.0",
"pydantic>=2.13.3,<3.0.0",
"uvicorn>=0.46.0,<0.47.0",
"pandas>=3.0.2,<4.0.0",
"geopy>=2.4.1,<3.0.0",
"starlette-prometheus>=0.10.0,<0.11.0",
"starlette>=1.0.0,<2.0.0",
"eccodes>=2.47.0,<3.0.0",
"cfgrib>=0.9.15.1,<0.10.0.0",
"loguru>=0.7.3,<0.8.0",
"netcdf4>=1.7.4,<2.0.0",
"lxml>=6.1.0,<7.0.0",
"accept-types>=0.4.1,<0.5.0",
"urllib3>=2.6.3,<3.0.0",
"requests>=2.33.1,<3.0.0",
"gunicorn>=25.3.0,<26.0.0",
"cdsapi>=0.7.7,<0.8.0",
"dask>=2026.3.0,<2027.0.0"
]

[project.scripts]
wpla_update_era5sl = "weather_provider_api.scripts.update_era5sl_repository:main"
wpla_update_era5land = "weather_provider_api.scripts.update_era5land_repository:main"
wpla_update_arome = "weather_provider_api.scripts.update_arome_repository:main"
wpla_update_waarnemingen = "weather_provider_api.scripts.update_waarnemingen_register:main"
wpla_clear_era5sl = "weather_provider_api.scripts.erase_era5sl_repository:main"
wpla_clear_era5land = "weather_provider_api.scripts.erase_era5land_repository:main"
wpla_clear_arome = "weather_provider_api.scripts.erase_arome_repository:main"
wpla_clear_waarnemingen = "weather_provider_api.scripts.erase_waarnemingen_register:main"
wpla_run_api = "weather_provider_api.__main__:launch_api"
generate-openapi = "weather_provider_api.scripts.openapi:generate_openapi_spec"

[tool.poetry]
include = ["var_maps/*.json"]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
coverage = "7.13.5"
pytest-cov = "7.1.0"
pylint = "4.0.5"
ruff = "0.15.12"
pytest = "^9.0.3"
sphinx = "9.1.0"
myst-parser = "5.0.0"
piccolo-theme = "0.24.0"  # Sphinx theme
fawltydeps = "0.20.0"

[tool.pylint]
max-line-length = 120

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.mypy-xarray]
ignore_missing_imports = true

[tool.mypy-pandas]
ignore_missing_imports = true

[tool.mypy-starlette]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ANN", "E", "F", "I", "D", "S", "NPY", "RUF"]
ignore = ["E501", "E712", "ANN202", "ANN204", "ANN401", "D100", "D104", "D106"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"
